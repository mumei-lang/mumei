[package]
name = "mumei-emit-llvm"
version = "0.7.0"
edition = "2021"
description = "LLVM IR emitter for the Mumei compiler"
license = "Apache-2.0"
repository = "https://github.com/mumei-lang/mumei"

[dependencies]
mumei-core = { path = "../mumei-core" }
inkwell = { version = "0.5.0", default-features = false, features = ["llvm17-0", "target-x86"] }
llvm-sys = "170.4.0"
libc = "0.2"
z3 = "0.24"

[dev-dependencies]
object = { version = "0.40.0", default-features = false, features = ["read", "elf"] }
tempfile = "3"
