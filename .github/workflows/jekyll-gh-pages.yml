# Reusable workflow for building and deploying a Jekyll site to GitHub Pages.
# Callers:
#   jobs:
#     pages:
#       uses: mumei-lang/mumei/.github/workflows/jekyll-gh-pages.yml@develop
#       permissions:
#         contents: read
#         pages: write
#         id-token: write
#       with:
#         destination: ./_site   # optional
name: Deploy Jekyll site to GitHub Pages

on:
  workflow_call:
    inputs:
      source:
        description: Jekyll site source directory
        required: false
        type: string
        default: ./
      destination:
        description: Jekyll build output directory
        required: false
        type: string
        default: ./_site
      post_build_command:
        description: Optional shell command run after the Jekyll build (e.g. copying extra files into the site)
        required: false
        type: string
        default: ""

# Deploys only through callers — this file intentionally has no push or
# workflow_dispatch trigger, so a direct run can never publish a site built
# without a caller's post_build_command (e.g. the install.sh copy).
#
# GITHUB_TOKEN permissions are granted by the calling job.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages-${{ github.repository }}"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ${{ inputs.source || './' }}
          destination: ${{ inputs.destination || './_site' }}
      - name: Run post-build command
        if: ${{ inputs.post_build_command != '' }}
        run: ${{ inputs.post_build_command }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ inputs.destination || './_site' }}

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry1.outputs.page_url || steps.deployment_retry2.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      # actions/deploy-pages intermittently fails with "Deployment failed, try
      # again later." when GitHub's Pages backend rejects an otherwise valid
      # deployment. Retry a couple of times before giving up.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before retry 1
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - name: Deploy to GitHub Pages (retry 1)
        id: deployment_retry1
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before retry 2
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry1.outcome == 'failure'
        run: sleep 60
      - name: Deploy to GitHub Pages (retry 2)
        id: deployment_retry2
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry1.outcome == 'failure'
        uses: actions/deploy-pages@v4
