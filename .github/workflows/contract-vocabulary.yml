name: Contract Vocabulary

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'README.md'
      - 'instruction.md'
      - 'mcp_server.py'
      - 'src/cli.rs'
      - 'scripts/check_contract_vocabulary.py'
      - 'tests/test_check_contract_vocabulary.py'
      - 'tests/test_ci_workflow_timeouts.py'
      - 'tests/test_check_mcp_tool_contract.py'
      - 'tests/test_check_proof_bundle_drift.py'
      - 'tests/test_lsp_diagnostic_data_doc.py'
      - 'docs/MCP_TOOL_CONTRACT.md'
      - 'docs/LSP_DIAGNOSTIC_DATA.md'
      - 'scripts/check_mcp_tool_contract.py'
      - '.github/workflows/contract-vocabulary.yml'
  push:
    branches: [develop]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'instruction.md'
      - 'mcp_server.py'
      - 'src/cli.rs'
      - 'scripts/check_contract_vocabulary.py'
      - 'tests/test_check_contract_vocabulary.py'
      - 'tests/test_ci_workflow_timeouts.py'
      - 'tests/test_check_mcp_tool_contract.py'
      - 'tests/test_check_proof_bundle_drift.py'
      - 'tests/test_lsp_diagnostic_data_doc.py'
      - 'docs/MCP_TOOL_CONTRACT.md'
      - 'docs/LSP_DIAGNOSTIC_DATA.md'
      - 'scripts/check_mcp_tool_contract.py'
      - '.github/workflows/contract-vocabulary.yml'
  workflow_dispatch:

jobs:
  contract-vocabulary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check docs contract vocabulary
        run: python3 scripts/check_contract_vocabulary.py

      - name: Check canonical mumei-forge MCP tool contract
        run: python3 scripts/check_mcp_tool_contract.py

      - name: Run extraction tests
        run: |
          python3 -m pip install --quiet pytest pyyaml
          python3 -m pytest tests/test_check_contract_vocabulary.py tests/test_ci_workflow_timeouts.py tests/test_check_mcp_tool_contract.py tests/test_check_proof_bundle_drift.py tests/test_lsp_diagnostic_data_doc.py -v
