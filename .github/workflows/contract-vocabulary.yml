# Cross-repo note (mumei-lang/mumei#1500): the reusable workflow owns only
# the common checkout/Python/timeout runner. mumei's broad path filter and
# check command are repo-specific because this repository is the canonical
# owner of proof/evidence schemas, MCP tool vocabulary, and producer-signature
# contract fixtures.
name: Contract Vocabulary

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'README.md'
      - 'docs/instruction.md'
      - 'mcp_server.py'
      - 'src/cli.rs'
      - 'scripts/check_contract_vocabulary.py'
      - 'schema/bridge_lemma_catalog.json'
      - 'schema/verification-evidence.schema.json'
      - 'schema/native-object-acceptance.schema.json'
      - 'schema/proof-cert.schema.json'
      - 'schema/producer-signature.schema.json'
      - 'tests/test_producer_signature_schema.py'
      - 'tests/test_native_object_acceptance_schema.py'
      - 'tests/fixtures/proof-cert/**'
      - 'tests/test_proof_cert_schema.py'
      - 'tests/fixtures/verification-evidence/**'
      - 'tests/test_verification_evidence_schema.py'
      - 'mumei-core/src/verification/types.rs'
      - 'mumei-core/src/verification_evidence.rs'
      - 'mumei-core/src/verification_evidence/**'
      - 'mumei-core/src/object_acceptance.rs'
      - 'mumei-core/src/object_acceptance/**'
      - 'tests/fixtures/proof-cert/verified_sample.proof-cert.json'
      - 'tests/test_check_contract_vocabulary.py'
      - 'tests/test_ci_workflow_timeouts.py'
      - 'tests/test_check_mcp_tool_contract.py'
      - 'tests/test_check_proof_bundle_drift.py'
      - 'tests/test_lsp_diagnostic_data_doc.py'
      - 'docs/MCP_TOOL_CONTRACT.md'
      - 'docs/LSP_DIAGNOSTIC_DATA.md'
      - 'scripts/check_mcp_tool_contract.py'
      - '.github/workflows/contract-vocabulary.yml'
      - '.github/workflows/reusable-contract-vocabulary.yml'
  push:
    branches: [develop]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'docs/instruction.md'
      - 'mcp_server.py'
      - 'src/cli.rs'
      - 'scripts/check_contract_vocabulary.py'
      - 'schema/bridge_lemma_catalog.json'
      - 'schema/verification-evidence.schema.json'
      - 'schema/native-object-acceptance.schema.json'
      - 'schema/proof-cert.schema.json'
      - 'schema/producer-signature.schema.json'
      - 'tests/test_producer_signature_schema.py'
      - 'tests/test_native_object_acceptance_schema.py'
      - 'tests/fixtures/proof-cert/**'
      - 'tests/test_proof_cert_schema.py'
      - 'tests/fixtures/verification-evidence/**'
      - 'tests/test_verification_evidence_schema.py'
      - 'mumei-core/src/verification/types.rs'
      - 'mumei-core/src/verification_evidence.rs'
      - 'mumei-core/src/verification_evidence/**'
      - 'mumei-core/src/object_acceptance.rs'
      - 'mumei-core/src/object_acceptance/**'
      - 'tests/fixtures/proof-cert/verified_sample.proof-cert.json'
      - 'tests/test_check_contract_vocabulary.py'
      - 'tests/test_ci_workflow_timeouts.py'
      - 'tests/test_check_mcp_tool_contract.py'
      - 'tests/test_check_proof_bundle_drift.py'
      - 'tests/test_lsp_diagnostic_data_doc.py'
      - 'docs/MCP_TOOL_CONTRACT.md'
      - 'docs/LSP_DIAGNOSTIC_DATA.md'
      - 'scripts/check_mcp_tool_contract.py'
      - '.github/workflows/contract-vocabulary.yml'
      - '.github/workflows/reusable-contract-vocabulary.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-vocabulary:
    uses: ./.github/workflows/reusable-contract-vocabulary.yml
    with:
      python_version: '3.12'
      install_command: python3 -m pip install --quiet pytest pyyaml 'jsonschema>=4.18,<5'
      check_command: |
        python3 scripts/check_contract_vocabulary.py
        python3 scripts/check_mcp_tool_contract.py
        python3 -m pytest tests/test_check_contract_vocabulary.py tests/test_ci_workflow_timeouts.py tests/test_check_mcp_tool_contract.py tests/test_check_proof_bundle_drift.py tests/test_lsp_diagnostic_data_doc.py tests/test_verification_evidence_schema.py tests/test_native_object_acceptance_schema.py tests/test_proof_cert_schema.py tests/test_producer_signature_schema.py -v
