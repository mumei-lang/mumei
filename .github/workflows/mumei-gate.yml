name: Mumei Claim Book and Charter gate

on:
  workflow_call:
    inputs:
      mumei-version:
        description: Release version to install; empty selects latest, and an optional leading v is accepted.
        required: false
        type: string
        default: ""
      working-directory:
        description: Project directory containing the sources and mumei.toml.
        required: false
        type: string
        default: "."
      sources:
        description: Whitespace-separated .mm paths relative to working-directory.
        required: true
        type: string
      require-grade:
        description: Optional minimum effective Seal Grade, G0 through G5.
        required: false
        type: string
        default: ""
      allow-lean-verified:
        description: Accept current Lean evidence for imports and Claim Book grades; required for G5.
        required: false
        type: boolean
        default: false
      certificates:
        description: Optional whitespace-separated proof certificates, one per source in the same order, relative to working-directory; claims and charter read these instead of the fresh certificate.
        required: false
        type: string
        default: ""
      require-discriminating:
        description: Require negative controls to discriminate the contracts.
        required: false
        type: boolean
        default: false
      observations:
        description: Optional test-harvest path relative to working-directory.
        required: false
        type: string
        default: ""
      charter:
        description: Run the configured Charter check for each source.
        required: false
        type: boolean
        default: false
      artifact-name:
        description: Name of the report artifact.
        required: false
        type: string
        default: mumei-gate-reports
      runs-on:
        description: GitHub runner image; GNU releases require glibc 2.39.
        required: false
        type: string
        default: ubuntu-24.04

jobs:
  gate:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Validate gate sources and certificates
        shell: bash
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          SOURCES: ${{ inputs.sources }}
          CERTIFICATES: ${{ inputs.certificates }}
        run: |
          set -euo pipefail

          read -r -d '' -a sources <<< "$SOURCES" || true
          if (( ${#sources[@]} == 0 )); then
            printf 'At least one source is required.\n' >&2
            exit 1
          fi

          read -r -d '' -a certificates <<< "$CERTIFICATES" || true
          cd "$WORKING_DIRECTORY"
          project_directory="$PWD"

          if [[ -n "$CERTIFICATES" ]]; then
            if (( ${#certificates[@]} != ${#sources[@]} )); then
              printf 'Certificate count (%s) must match source count (%s).\n' \
                "${#certificates[@]}" "${#sources[@]}" >&2
              exit 1
            fi
            for certificate in "${certificates[@]}"; do
              if [[ "$certificate" == /* ]]; then
                certificate_path="$certificate"
              else
                certificate_path="$project_directory/$certificate"
              fi
              if [[ ! -f "$certificate_path" ]]; then
                printf 'Certificate %q does not exist or is not a file.\n' \
                  "$certificate" >&2
                exit 1
              fi
            done
          fi

      - name: Install Mumei
        shell: bash
        env:
          MUMEI_HOME: ${{ runner.temp }}/mumei
          MUMEI_VERSION: ${{ inputs.mumei-version }}
        run: |
          set -euo pipefail

          if [[ -n "$MUMEI_VERSION" ]]; then
            version="v${MUMEI_VERSION#v}"
            asset_url="https://github.com/mumei-lang/mumei/releases/download/${version}/mumei-x86_64-unknown-linux-gnu.tar.gz"
          else
            asset_url="https://github.com/mumei-lang/mumei/releases/latest/download/mumei-x86_64-unknown-linux-gnu.tar.gz"
          fi

          archive="$RUNNER_TEMP/mumei-release.tar.gz"
          curl -fsSL --retry 3 "$asset_url" -o "$archive"
          mkdir -p "$MUMEI_HOME"
          tar -xzf "$archive" -C "$MUMEI_HOME"
          echo "$MUMEI_HOME" >> "$GITHUB_PATH"
          echo "MUMEI_STD_PATH=$MUMEI_HOME/std" >> "$GITHUB_ENV"
          export PATH="$MUMEI_HOME:$PATH"
          export MUMEI_STD_PATH="$MUMEI_HOME/std"
          mumei --version

      - name: Run Claim Book and Charter gates
        shell: bash
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          SOURCES: ${{ inputs.sources }}
          REQUIRE_GRADE: ${{ inputs.require-grade }}
          ALLOW_LEAN_VERIFIED: ${{ inputs.allow-lean-verified }}
          CERTIFICATES: ${{ inputs.certificates }}
          REQUIRE_DISCRIMINATING: ${{ inputs.require-discriminating }}
          OBSERVATIONS: ${{ inputs.observations }}
          CHARTER: ${{ inputs.charter }}
        run: |
          set -euo pipefail

          if [[ -n "$REQUIRE_GRADE" && ! "$REQUIRE_GRADE" =~ ^G[0-5]$ ]]; then
            printf 'Invalid require-grade %q; expected G0 through G5.\n' "$REQUIRE_GRADE" >&2
            exit 1
          fi

          read -r -d '' -a sources <<< "$SOURCES" || true
          if (( ${#sources[@]} == 0 )); then
            printf 'At least one source is required.\n' >&2
            exit 1
          fi

          read -r -d '' -a certificates <<< "$CERTIFICATES" || true

          source_slugs=()
          for source in "${sources[@]}"; do
            slug="${source%.mm}"
            slug="${slug//\//__}"
            for seen_index in "${!source_slugs[@]}"; do
              if [[ "${source_slugs[$seen_index]}" == "$slug" ]]; then
                printf 'Sources %q and %q map to the same report directory %q.\n' \
                  "${sources[$seen_index]}" "$source" "$slug" >&2
                exit 1
              fi
            done
            source_slugs+=("$slug")
          done

          gate_dir="$RUNNER_TEMP/mumei-gate"
          mkdir -p "$gate_dir"
          cd "$WORKING_DIRECTORY"
          project_directory="$PWD"

          certificate_paths=()
          if [[ -n "$CERTIFICATES" ]]; then
            if (( ${#certificates[@]} != ${#sources[@]} )); then
              printf 'Certificate count (%s) must match source count (%s).\n' \
                "${#certificates[@]}" "${#sources[@]}" >&2
              exit 1
            fi
            for certificate in "${certificates[@]}"; do
              if [[ "$certificate" == /* ]]; then
                certificate_path="$certificate"
              else
                certificate_path="$project_directory/$certificate"
              fi
              if [[ ! -f "$certificate_path" ]]; then
                printf 'Certificate %q does not exist or is not a file.\n' \
                  "$certificate" >&2
                exit 1
              fi
              certificate_paths+=("$certificate_path")
            done
          fi

          failed=0

          run_gate_command() {
            local label="$1"
            shift
            local command_status
            if "$@"; then
              command_status=0
            else
              command_status=$?
            fi
            printf -- "- \`%s\`: exit code \`%s\`\n" "$label" "$command_status" >> "$GITHUB_STEP_SUMMARY"
            if (( command_status != 0 )); then
              failed=1
            fi
          }

          for source_index in "${!sources[@]}"; do
            source="${sources[$source_index]}"
            slug="${source_slugs[$source_index]}"
            out="$gate_dir/$slug"
            cert="$out/$slug.proof.json"
            mkdir -p "$out"

            printf '### %s\n\n' "$source" >> "$GITHUB_STEP_SUMMARY"
            verify_args=(mumei verify "$source" --proof-cert --output "$cert")
            if [[ "$ALLOW_LEAN_VERIFIED" == "true" ]]; then
              verify_args+=(--allow-lean-verified)
            fi
            run_gate_command "mumei verify" "${verify_args[@]}"
            for report in cross_spec.json report.json; do
              if [[ -f "$project_directory/$report" ]]; then
                mv "$project_directory/$report" "$out/$report"
              fi
            done

            claim_cert="$cert"
            claim_cert_summary="fresh"
            if (( ${#certificate_paths[@]} > 0 )); then
              supplied_cert="${certificate_paths[$source_index]}"
              supplied_cert_copy="$out/$slug.supplied.proof.json"
              cp "$supplied_cert" "$supplied_cert_copy"
              claim_cert="$supplied_cert_copy"
              claim_cert_summary="supplied: ${certificates[$source_index]}"
            fi
            printf -- "- Claim Book certificate: \`%s\`\n" "$claim_cert_summary" \
              >> "$GITHUB_STEP_SUMMARY"

            claims_args=(mumei claims "$source" --cert "$claim_cert" --format both --out-dir "$out")
            if [[ "$ALLOW_LEAN_VERIFIED" == "true" ]]; then
              claims_args+=(--allow-lean-verified)
            fi
            if [[ -n "$REQUIRE_GRADE" ]]; then
              claims_args+=(--require-grade "$REQUIRE_GRADE")
            fi
            if [[ "$REQUIRE_DISCRIMINATING" == "true" ]]; then
              claims_args+=(--require-discriminating)
            fi
            if [[ -n "$OBSERVATIONS" ]]; then
              claims_args+=(--observations "$OBSERVATIONS")
            fi
            run_gate_command "mumei claims" "${claims_args[@]}"

            charter_status="not enabled"
            if [[ "$CHARTER" == "true" ]]; then
              charter_args=(mumei charter check "$source" --cert "$claim_cert")
              if [[ "$ALLOW_LEAN_VERIFIED" == "true" ]]; then
                charter_args+=(--allow-lean-verified)
              fi
              if [[ -n "$REQUIRE_GRADE" ]]; then
                charter_args+=(--require-grade "$REQUIRE_GRADE")
              fi
              charter_args+=(--json)
              run_gate_command "mumei charter check" "${charter_args[@]}"
              if [[ -f "$project_directory/charter_report.json" ]]; then
                mv "$project_directory/charter_report.json" "$out/charter_report.json"
              fi
              if [[ -f "$out/charter_report.json" ]]; then
                charter_status="$(
                  python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("status", "unknown"))' \
                    "$out/charter_report.json" 2>/dev/null || printf 'unavailable'
                )"
              else
                charter_status="unavailable"
              fi
            fi
            printf -- "- Charter status: \`%s\`\n\n" "$charter_status" >> "$GITHUB_STEP_SUMMARY"

            printf '#### Claim Book\n\n' >> "$GITHUB_STEP_SUMMARY"
            if [[ -f "$out/CLAIMBOOK.md" ]]; then
              cat "$out/CLAIMBOOK.md" >> "$GITHUB_STEP_SUMMARY"
              printf '\n' >> "$GITHUB_STEP_SUMMARY"
            else
              printf '_CLAIMBOOK.md was not generated._\n\n' >> "$GITHUB_STEP_SUMMARY"
            fi
            printf '%s\n\n' '---' >> "$GITHUB_STEP_SUMMARY"
          done

          exit "$failed"

      - name: Upload gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ runner.temp }}/mumei-gate
          if-no-files-found: ignore
