name: Generate std/ Proof Certificates

# SI-5 Phase 3-C: Generate a per-module proof certificate (.proof.json) for
# every file under std/ and upload them as a CI artifact. These certificates
# are later fanned-in to a single std-proof-bundle.json by
# scripts/bundle_std_certs.py and distributed via homebrew-mumei.
#
# std/certs/ is in .gitignore — raw per-module certs are intermediate
# artefacts and are NOT committed to the repo. This workflow uploads both
# the per-module certificates and the aggregate bundle.
on:
  push:
    branches: [develop]
    paths:
      - 'std/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-certs:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install system deps (LLVM 17, Z3)
        run: |
          sudo apt-get update
          sudo apt-get install -y libz3-dev pkg-config libssl-dev libzstd-dev z3
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          codename=$(lsb_release -cs)
          echo "deb http://apt.llvm.org/${codename}/ llvm-toolchain-${codename}-17 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-17.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y llvm-17-dev libclang-17-dev libpolly-17-dev
          echo "LLVM_SYS_170_PREFIX=/usr/lib/llvm-17" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=/usr/lib/llvm-17/lib" >> "$GITHUB_ENV"
      - name: Build mumei (release)
        run: cargo build --release
      - name: Generate per-module certificates
        run: |
          set -u
          mkdir -p std/certs
          # Iterate every .mm file under std/, including nested subdirectories.
          # Failures are tolerated per-file so one broken module doesn't block
          # certificate generation for the rest.
          find std -type f -name '*.mm' -print0 | while IFS= read -r -d '' f; do
            rel="${f#std/}"            # e.g. container/safe_queue.mm
            stem="${rel%.mm}"          # e.g. container/safe_queue
            outdir="std/certs/$(dirname "$stem")"
            mkdir -p "$outdir"
            out="std/certs/${stem}.proof.json"
            echo "Generating cert for $f -> $out"
            ./target/release/mumei verify --proof-cert --output "$out" "$f" \
              || echo "::warning::verify failed for $f (continuing)"
          done
      - name: Gate on certificate validity (mumei verify-cert --strict)
        run: |
          set -u
          # Every certificate that was produced above must still validate
          # against its source. --strict also fails on drifted (`changed`)
          # atoms and on certificates without a re-derivable
          # certificate_hash, so an invalidated certificate cannot reach the
          # uploaded artifact or the homebrew bundle.
          rm -f /tmp/cert-gate-failures
          touch /tmp/cert-gate-failures
          find std/certs -type f -name '*.proof.json' -print0 \
            | while IFS= read -r -d '' cert; do
              rel="${cert#std/certs/}"       # e.g. container/safe_queue.proof.json
              src="std/${rel%.proof.json}.mm"
              if [ ! -f "$src" ]; then
                echo "::error::no source found for $cert (expected $src)"
                echo "fail" >> /tmp/cert-gate-failures
                continue
              fi
              echo "Verifying $cert against $src"
              if ! ./target/release/mumei verify-cert "$cert" "$src" --strict; then
                echo "::error::certificate gate failed for $src ($cert)"
                echo "fail" >> /tmp/cert-gate-failures
              fi
            done
          checked=$(find std/certs -type f -name '*.proof.json' | wc -l)
          if [ "$checked" -eq 0 ]; then
            echo "::error::no certificates were generated; nothing to distribute"
            exit 1
          fi
          if [ -s /tmp/cert-gate-failures ]; then
            failed=$(wc -l < /tmp/cert-gate-failures)
            echo "::error::$failed certificate(s) failed verify-cert --strict"
            exit 1
          fi
          echo "verify-cert --strict passed for $checked certificate(s)"
      - name: Bundle std/ proof certificates
        run: |
          python3 scripts/bundle_std_certs.py \
            --certs-dir std/certs \
            --output std-proof-bundle.json \
            --mumei-version "${GITHUB_REF_NAME#v}"
      - name: Upload certificates artifact
        uses: actions/upload-artifact@v4
        with:
          name: std-proof-certs
          path: |
            std/certs/
            std-proof-bundle.json
